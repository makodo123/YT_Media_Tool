name: Windows CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]  # 只修改文件時不重跑
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"            # 讓繁體中文輸出在非 UTF-8 主控台也不會出錯
  QT_QPA_PLATFORM: offscreen # GUI 測試與 --smoke-test 不需要實體螢幕
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: 測試（Windows / Python 3.12）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安裝相依套件
        run: python -m pip install -r requirements-dev.txt

      - name: 安裝 FFmpeg（整合測試使用）
        run: choco install ffmpeg -y --no-progress

      - name: 靜態分析（ruff）
        run: python -m ruff check src tests main.py scripts

      - name: 執行 pytest（含本機 HTTP 整合測試，不連線 YouTube）
        run: python -m pytest -ra --junitxml=test-results.xml

      - name: 將失敗測試轉為註解
        if: failure()
        run: python scripts/junit_annotations.py test-results.xml

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  build:
    name: 打包 EXE（隨附 FFmpeg 與 Deno）
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 建立 .venv 並安裝相依套件
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      # 與 release.yml 相同的打包流程（只差不發佈），確保每次推送都驗證完整的發行路徑
      - name: 下載並驗證 FFmpeg（依 manifest 的 SHA256）
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "fetch_ffmpeg" -Command "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch_ffmpeg.ps1"

      - name: 打包（隨附 FFmpeg 與 Deno）、結構檢查與啟動測試
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "build_exe" -Command "scripts\build_exe.bat --skip-tests"

      - name: 上傳發行檔
        uses: actions/upload-artifact@v5
        with:
          name: YT_Media_Tool-win64
          path: |
            dist/YT_Media_Tool-*-win64.zip
            dist/YT_Media_Tool-*-win64.zip.sha256
          if-no-files-found: error
          retention-days: 14
