name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"            # 讓繁體中文輸出在非 UTF-8 主控台也不會出錯
  QT_QPA_PLATFORM: offscreen # GUI 測試與 --smoke-test 不需要實體螢幕
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: 測試（Windows / Python 3.12）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安裝相依套件
        run: python -m pip install -r requirements-dev.txt

      - name: 安裝 FFmpeg（整合測試使用）
        run: choco install ffmpeg -y --no-progress

      - name: 靜態分析（ruff）
        run: python -m ruff check src tests main.py scripts

      - name: 執行 pytest（含本機 HTTP 整合測試，不連線 YouTube）
        run: python -m pytest -ra --junitxml=test-results.xml

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  build:
    name: 打包 EXE（不隨附 FFmpeg）
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 建立 .venv 並安裝相依套件
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      # 隨附 FFmpeg 的版本需先在 packaging/ffmpeg_manifest.json 填入經官方比對的 SHA256，
      # 因此 CI 先建置不隨附 FFmpeg 的版本（仍隨附 Deno），並以 --smoke-test 實際啟動 EXE。
      - name: PyInstaller 建置、結構檢查與啟動測試
        shell: cmd
        run: scripts\build_exe.bat --no-ffmpeg --skip-tests

      - name: 上傳發行檔
        uses: actions/upload-artifact@v4
        with:
          name: YT_Media_Tool-win64-no-ffmpeg
          path: |
            dist/YT_Media_Tool-*-win64.zip
            dist/YT_Media_Tool-*-win64.zip.sha256
          if-no-files-found: error
          retention-days: 14
