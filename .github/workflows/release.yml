name: Release

# 觸發方式（三擇一）：
#   1. GitHub 網頁：Actions → Release → Run workflow，輸入版本標籤（例如 v2.0.0）
#   2. 推送版本標籤：git tag v2.0.0 && git push origin v2.0.0
#   3. 推送 release/<標籤> 分支：git push origin HEAD:release/v2.0.0
# 流程：Windows 上執行完整測試 → 打包隨附 FFmpeg 與 Deno 的 EXE → 實際啟動檢查 → 建立並測試安裝程式 → 建立 GitHub Release
#（標籤不存在時由 GitHub 於本次 commit 建立）。標籤含「-」（例如 -beta.1）時發佈為「預先發行版本」。
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本標籤（例如 v2.0.0 或 v2.0.0-beta.1）"
        required: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: 打包並發佈 Windows 版本
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: 決定版本標籤
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $tag = $env:INPUT_TAG }
          elseif ($env:GITHUB_REF -like "refs/heads/release/*") { $tag = $env:GITHUB_REF_NAME -replace "^release/", "" }
          else { $tag = $env:GITHUB_REF_NAME }
          $tag = "$tag".Trim()  # 手動輸入時常夾帶前後空白
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { Write-Output "::error::標籤格式不正確：「$tag」（格式例如 v2.1.1 或 v2.2.0-beta.1）"; exit 1 }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 檢查標籤與程式版本一致
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $ver = (Select-String -Path src/yt_media_tool/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $bat = (Select-String -Path scripts/build_exe.bat -Pattern 'set "VERSION=(.+)"').Matches[0].Groups[1].Value
          if ($ver -ne $bat) { Write-Output "::error::__init__.py ($ver) 與 build_exe.bat ($bat) 版本不一致"; exit 1 }
          if ($tag -ne "v$ver" -and -not $tag.StartsWith("v$ver-")) {
            Write-Output "::error::標籤 $tag 與程式版本 v$ver 不一致"; exit 1
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 建立 .venv 並安裝相依套件
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: 安裝 FFmpeg（測試使用；打包則使用 manifest 固定並驗證 SHA256 的版本）
        run: choco install ffmpeg -y --no-progress

      - name: 執行 pytest
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "pytest" -Command ".venv\Scripts\python.exe -m pytest -q -ra --junitxml=test-results.xml"

      - name: 將失敗測試轉為註解
        if: failure()
        shell: pwsh
        run: .venv\Scripts\python.exe scripts/junit_annotations.py test-results.xml

      - name: 下載並驗證 FFmpeg（依 manifest 的 SHA256）
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "fetch_ffmpeg" -Command "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch_ffmpeg.ps1"

      - name: 打包（隨附 FFmpeg 與 Deno）、結構檢查與啟動測試
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "build_exe" -Command "scripts\build_exe.bat --skip-tests"

      - name: 安裝 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 建立安裝程式
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "build_installer" -Command ".venv\Scripts\python.exe scripts\build_installer.py"

      - name: 安裝 / 啟動 / 解除安裝測試
        shell: pwsh
        run: ./scripts/ci_run.ps1 -Title "verify_installer" -Command ".venv\Scripts\python.exe scripts\verify_installer.py"

      - name: 建立 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "YT_Media_Tool-*-win64*" } | ForEach-Object FullName
          if ($files.Count -lt 4) { Write-Output "::error::發行檔不齊全（需要 zip、安裝程式與兩個 .sha256）：$($files -join ', ')"; exit 1 }
          $notes = Get-Content docs/RELEASE_NOTES.md -Raw -Encoding UTF8
          $extra = @()
          if ($tag.Contains("-")) {
            $notes = "> ⚠ **預先發行版本**：已通過自動化測試與 Windows 打包啟動檢查，尚未完成實機 YouTube 下載驗證。`n`n" + $notes
            $extra += "--prerelease"
          }
          $notes = "## 下載`n`n- **安裝版（建議）**：下載 ``YT_Media_Tool-*-win64-setup.exe`` 並執行，會建立開始功能表與桌面捷徑，可從「設定 → 應用程式」解除安裝。`n- **免安裝版**：下載 ``YT_Media_Tool-*-win64.zip``，解壓縮後執行 ``YT_Media_Tool\YT_Media_Tool.exe``。`n`n" + $notes
          Set-Content -Path release_notes.md -Value $notes -Encoding UTF8
          gh release create $tag @files --title "YT Media Tool $tag" --notes-file release_notes.md --target $env:GITHUB_SHA @extra
